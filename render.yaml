services:
  - type: web
    name: slack-skip-trace-bot
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/qperkins/scrape-skip-trace-bot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 600 bot:flask_app
    healthCheckPath: /health
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: TRACERFY_API_KEY
        sync: false
      - key: RESULTS_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
